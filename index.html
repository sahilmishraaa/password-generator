<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">

        <h1>
            Generate a <br>
            <span>Random Password</span>
        </h1>

        <p>Never use an insecure password again.</p>

        <div class="options">
            <label>
                Length:
                <input type="number" id="length-el" min="4" max="50" value="12">
            </label>

            <label>
                <input type="checkbox" id="uppercase-el" checked>
                Uppercase
            </label>

            <label>
                <input type="checkbox" id="lowercase-el" checked>
                Lowercase
            </label>

            <label>
                <input type="checkbox" id="numbers-el" checked>
                Numbers
            </label>

            <label>
                <input type="checkbox" id="symbols-el">
                Symbols
            </label>
        </div>

        <button onclick="providePassword()" id="generate-btn">Generate Passwords</button>

        <hr>
        <p id="no-checkbox-el"></p>
        <div class="passwords">
            <div class="password-card">
                <div class="password-box" id="password1"></div>
                <img id="copy-btn-el1" src="./copy.png" alt="copy">
            </div>

            <div class="password-card">
                <div class="password-box" id="password2"></div>
                <img id="copy-btn-el2" src="./copy.png" alt="copy">
            </div>
        </div>

    </div>
    <script src="index.js"></script>
</body>

</html>
